# Automatisierte Dependency-Updates (Bot öffnet PRs).
# Ergänzt security.yml (CVE-/Lizenz-Gate): findet veraltete/EOL-Pakete strukturell,
# statt erst dann, wenn eine CVE veröffentlicht ist.
#
# Layout: Single-Package-Repo. Drei npm-Verzeichnisse:
#   /                  → das SDK selbst (nur devDependencies + peerDependencies)
#   /template/backend  → App-Scaffold, wird von /new-app in jedes neue App-Repo kopiert
#   /template/frontend → dito
# Die Ordner backend/ + frontend/ im Root sind generierter tsc-Output — KEINE npm-Verzeichnisse.
#
# KEIN target-branch (anders als im Kernel, der auf `staging` reifen lässt): efa-sdk hat
# keinen aktiven Integrationsbranch (`development` läuft `main` hinterher und trägt nichts
# Eigenes), und ein Dependency-PR gegen einen toten Branch wird nie gemergt. PRs gehen
# also gegen `main` und werden dort durch build-check.yml + security.yml abgesichert.
#
# Grouping: alle minor/patch-Updates pro Verzeichnis in EINEN PR → 1 PR/Woche statt vieler.
# Major-Updates kommen als EINZELNE PRs (bewusste manuelle Review) — mit einer Ausnahme:
# die ESLint-Familie muss gemeinsam springen (siehe Kommentar beim eslint-Major-Block).
#
# ── Cooldown (Mindest-Release-Alter) ────────────────────────────────────────
# Dependabot oeffnet fuer eine neue Version erst NACH Ablauf des Cooldowns einen
# PR. Das ist die eigentliche Absicherung hinter dem Auto-merge in
# .github/workflows/dependabot-automerge.yml: fuer eine frisch kompromittierte
# Paketversion existiert noch kein CVE-Eintrag, den Trivy oder `npm audit` kennen
# koennten — alle Checks waeren gruen und der PR wuerde unbeaufsichtigt bis ins
# signierte Image durchlaufen. GitHubs Default liegt seit 07/2026 bei 3 Tagen;
# wir heben auf 7 an (14 fuer Majors), weil patch/minor hier ohne Menschen mergen.
#
# WICHTIG: Der Cooldown gilt ausschliesslich fuer VERSION-Updates. Security-
# Updates aus Dependabot-Alerts laufen bewusst ungebremst durch — ein CVE-Fix
# soll sofort kommen.
#
# Zeitplan-Policy (plattformweit, ci/README.md): npm weekly, docker +
# github-actions monthly — die beiden bewegen sich langsam und erzeugen
# woechentlich vor allem Rauschen, das die npm-PRs zudeckt.
version: 2
updates:
  # --- npm: das SDK selbst ---
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-patch-days: 7
      semver-minor-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      # @eslint/js@10 fordert peerOptional eslint@^10: ein Einzel-Major-PR auf eines der
      # beiden Pakete bricht `npm ci` mit ERESOLVE und reißt damit den kompletten
      # Lint-Gate ein. Die Familie deshalb gemeinsam anheben.
      eslint-major:
        patterns: ["eslint", "@eslint/*", "typescript-eslint", "eslint-plugin-*"]
        update-types: ["major"]
    ignore:
      # ── devDeps, die nur peerDependencies SPIEGELN ───────────────────────────
      # Diese Pakete stehen hier nicht, weil das SDK sie benutzt, sondern damit der
      # Typecheck gegen die MINIMAL unterstützte Version läuft (peer `react >=18`,
      # `i18next >=23`, `express >=4` …). Würden wir sie mit-anheben, prüften wir
      # nur noch die neueste Version — und ein Bruch gegen die Untergrenze fiele
      # erst beim Konsumenten auf. Ein Major hier ist deshalb eine bewusste
      # Anhebung der Support-Untergrenze, kein Dependency-Update: er gehört in
      # einen eigenen Commit samt peerDependencies-Anpassung und Major-Release,
      # nicht in einen Bot-PR.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "i18next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "i18next-http-backend"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-i18next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pg"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/pg"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jsonwebtoken"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jsonwebtoken"
        update-types: ["version-update:semver-major"]
      - dependency-name: "lucide-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@radix-ui/*"
        update-types: ["version-update:semver-major"]
      # ── Laufzeit-/Toolchain-Linien ──────────────────────────────────────────
      # @types/node auf der Untergrenze halten: engines sagt `node >=20`. Mit
      # neueren Typen würden Node-24-only-APIs unbemerkt durchrutschen und erst
      # bei einem Konsumenten auf Node 20 knallen.
      - dependency-name: "@types/node"
        versions: [">=21"]
      # TS auf der letzten JS-basierten Linie (6.0.x) halten — der native 7.0-Compiler
      # wird von typescript-eslint nicht unterstützt (Lint bricht hart ab, nicht nur
      # einzelne Regeln). Siehe CLAUDE.md „TypeScript-Version". Kein Auto-Major.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # --- npm: App-Scaffold Backend ---
  - package-ecosystem: npm
    directory: /template/backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-patch-days: 7
      semver-minor-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Das Scaffold spiegelt die Plattform-Linien, nicht „das Neueste": alle Apps
      # fahren Express 4; ein Sprung auf 5 ist ein eigenes Vorhaben (Breaking) und
      # muss zuerst im SDK (peer `express >=4`) und in den Bestands-Apps passieren.
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        versions: [">=25"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # --- npm: App-Scaffold Frontend ---
  - package-ecosystem: npm
    directory: /template/frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-patch-days: 7
      semver-minor-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Tailwind bleibt plattformweit v3-LTS — v4 ist Breaking (eigenes Vorhaben).
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # React 18 ist die Plattform-Linie (SDK-peer `react >=18`, alle Apps auf 18).
      # Ein Sprung auf 19 wird plattformweit koordiniert, nicht per Scaffold-PR.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # react-router bleibt auf v6: v7 zieht das Data-Router-Modell nach und würde
      # den HashRouter-Deeplink-Vertrag der eingebetteten Apps berühren.
      - dependency-name: "react-router-dom"
        update-types: ["version-update:semver-major"]
      # lucide-react folgt der SDK-peer-Untergrenze (>=0.400.0).
      - dependency-name: "lucide-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # --- Docker-Base-Images der Scaffold-Dockerfiles ---
  # `directories` (Mehrzahl) statt drei Einzelblöcke: der docker-Updater scannt NICHT
  # rekursiv, sondern nur Dateien direkt im konfigurierten Verzeichnis. /template muss
  # deshalb eigens genannt werden — dort liegt `Dockerfile.single` (3× FROM node:24-alpine
  # mit Digest-Pin) für die Single-Container-Variante.
  - package-ecosystem: docker
    directories:
      - /template
      - /template/backend
      - /template/frontend
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Node-Base bleibt plattformweit 24 LTS (nicht auf 25/26 vorziehen).
      # Digest-/Security-Updates innerhalb der Linie laufen weiter.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # --- GitHub-Actions (checkout, setup-node, trivy-action, …) ---
  # Wichtig hier: aquasecurity/trivy-action hat KEINEN mitwandernden Major-Tag, die
  # Workflows pinnen deshalb exakt (@v0.36.0). Ohne diesen Block veraltet der Pin still.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # --- GitHub-Actions IM SCAFFOLD ---
  # Nötig als eigener Block: bei `directory: /` scannt der github-actions-Updater
  # ausschließlich das Repo-Root-.github/workflows, keine Unterverzeichnisse. Die vier
  # Scaffold-Workflows (docker-image[.single].yml, image-scan.yml, security.yml) pinnen
  # u. a. 3× aquasecurity/trivy-action@v0.36.0 und die docker/*-Actions — ohne diesen
  # Block verfallen genau die Pins still, die jede neue App per /new-app erbt.
  - package-ecosystem: github-actions
    directory: /template/.github/workflows
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
