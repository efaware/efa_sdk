name: Security & License Scan

# Ergänzt build-check.yml (Compile/Test/Lint) und publish.yml (nur Tag-Push) um
# kontinuierliche Dependency-Prüfung: auf jeden Push/PR + wöchentlich.
# Struktur folgt der kanonischen Vorlage aus apps/converge-kernel, angepasst an das
# Single-Package-Layout des SDK.
#
# Gescannt werden DREI npm-Verzeichnisse:
#   .                  → das SDK selbst (0 runtime-dependencies, alles peer/dev)
#   template/backend   → App-Scaffold, wird von /new-app in jedes neue App-Repo kopiert
#   template/frontend  → dito
# Das Scaffold mitzuscannen ist Absicht: eine CVE dort vererbt sich in jede neu
# angelegte App, und niemand sonst prüft diese Lockfiles.

on:
  push:
    branches: [main, development]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # montags 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# Ein einziger, geteilter self-hosted Runner (dw-vps-converge) bedient alle Repos —
# dort standen zeitweise vier Jobs 15-21 Minuten in der Queue. Überholte Läufe desselben
# Branches deshalb abbrechen, statt sie die Queue verstopfen zu lassen.
concurrency:
  # Literaler Gruppenname (NICHT ${{ github.workflow }}): in einem per
  # workflow_call gerufenen Workflow löst github.workflow auf den Namen des
  # AUFRUFERS auf — der Publish-Lauf teilte sich sonst die Gruppe mit fremden Läufen.
  group: security-${{ github.ref }}
  cancel-in-progress: true

# Trivy zieht seine Vuln-DB per Default vom GCR-Mirror (mirror.gcr.io/aquasec/trivy-db),
# der zeitweise 404 liefert und den Scan-Job hart fehlschlagen lässt (kein echtes Finding,
# reiner Infra-Flake). Auf die kanonische GHCR-Quelle zeigen — stabiler, anonym ziehbar.
# Fremde Actions sind auf den Commit-SHA gepinnt (ein Tag ist verschiebbar — wer den
# Tag umhängt, führt beliebigen Code in unserer CI aus). Dependabot aktualisiert
# SHA-Pins mitsamt dem Versionskommentar, der Pin veraltet also nicht.
env:
  TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
  # Trivy überspringt in npm-Lockfiles per Default die devDependencies. Ohne diesen
  # Schalter wäre der Scan hier strukturell wirkungslos: das SDK selbst hat NULL
  # runtime-dependencies (alles peer/dev), und auch im Scaffold hängen die
  # interessanten Funde an der Build-/Test-Toolchain. Verifiziert: ohne den Schalter
  # taucht das Root-Lockfile nicht einmal als Scan-Target auf.
  TRIVY_INCLUDE_DEV_DEPS: true

jobs:
  npm-audit:
    name: npm audit (${{ matrix.dir }})
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || vars.RUNNER_LABEL || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        dir: ['.', template/backend, template/frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Hard-Fail bei HIGH + CRITICAL. Verbleibende Moderate/Low stehen im BACKLOG.
      - name: npm audit
        working-directory: ${{ matrix.dir }}
        run: npm audit --audit-level=high

  licenses:
    name: License gate (${{ matrix.dir }})
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || vars.RUNNER_LABEL || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        dir: ['.', template/backend, template/frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install (prod only, no scripts)
        working-directory: ${{ matrix.dir }}
        # npm install (nicht ci) — tolerant gegen Lockfile-Drift; CI-Install ist ephemer.
        # Hinweis zum Repo-Root: @efa-one/sdk hat NULL runtime-dependencies (alles peer +
        # dev), der prod-Install installiert dort also nichts und das Gate ist strukturell
        # leer. Das ist korrekt und beabsichtigt — das SDK bündelt keine fremde Lizenz.
        # Der Job bleibt trotzdem stehen: sobald jemand eine echte dependency aufnimmt,
        # greift er ohne weiteres Zutun.
        run: npm install --omit=dev --ignore-scripts --no-audit --no-fund
      - name: License summary (informativ)
        working-directory: ${{ matrix.dir }}
        run: npx --yes license-checker --production --excludePrivate --summary
      # ── ALLOWLIST, keine Blacklist ────────────────────────────────────────
      # Bis 09/2026 stand hier `--failOn "GPL;AGPL;LGPL;…"`. Eine Blacklist laesst
      # per Konstruktion alles durch, was nicht auf ihr steht — also SSPL, BUSL-1.1,
      # Elastic-2.0, CC-BY-NC, PolyForm und jedes Paket ganz ohne Lizenzfeld
      # (`UNKNOWN`). `--onlyAllow` dreht die Beweislast um: eine neue Lizenz muss
      # hier bewusst eingetragen werden. Liste identisch zur kanonischen Fassung
      # (converge_meta `ci/templates/shared/security.yml`) — sie gilt plattformweit.
      #
      # Compound-Strings ("(MPL-2.0 OR Apache-2.0)") muessen woertlich in der Liste
      # stehen — license-checker vergleicht den gemeldeten String, er loest den
      # SPDX-Ausdruck nicht auf. Ein angehaengtes `*` (Lizenz aus der LICENSE-Datei
      # geraten statt deklariert, z. B. `MIT*`) wird beim Vergleich ignoriert.
      #
      # --excludePrivate: template/backend + template/frontend sind `private: true`
      # und melden sich sonst als UNLICENSED. Das Repo-Root (@efa-one/sdk) ist NICHT
      # private und deklariert korrekt Apache-2.0 — es laeuft regulaer durch das Gate.
      - name: Fail on non-permissive license
        working-directory: ${{ matrix.dir }}
        run: >
          npx --yes license-checker --production --excludePrivate
          --onlyAllow "MIT;MIT-0;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;MPL-2.0;OFL-1.1;Unlicense;CC0-1.0;BlueOak-1.0.0;Python-2.0;(MPL-2.0 OR Apache-2.0)"

  trivy:
    name: Trivy filesystem scan
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      # Scannt alle Lockfiles (Root + template/*) sowie die Dockerfiles des Scaffolds.
      # ignore-unfixed: keine Fehlschläge bei CVEs ohne verfügbaren Fix.
      - name: Trivy fs scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      # WICHTIG: Der Scan oben (ignore-unfixed) blendet CVEs ohne Fix aus — genau die
      # Klasse, die eine EOL-Runtime/-Dependency produziert. Dieser zweite, NICHT
      # blockierende Pass macht sie sichtbar, damit „kein Fix verfügbar" nicht
      # „unsichtbar" bedeutet.
      - name: Trivy fs scan — unfixed sichtbar machen (informativ)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 0

  trivy-secrets:
    name: Trivy secret scan (blockierend)
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      # Angeglichen an die App-Repos (09/2026): versehentlich eingecheckte Secrets
      # sind selten False-Positives und blockieren deshalb den Merge — anders als
      # der Misconfig-Scan darunter. Vorher lief beides zusammen als report-only,
      # ein echtes Secret waere hier also nur als gruene Notiz durchgelaufen.
      - name: Trivy secret scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          severity: HIGH,CRITICAL
          exit-code: 1

  trivy-config:
    name: Trivy misconfig scan (report-only)
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      # Prueft die Scaffold-Dockerfiles auf Haertungsluecken (root-User, fehlendes
      # cap_drop, ungepinnte Images). exit-code 0 = report-only: sichtbar machen,
      # ohne jeden Build zu brechen, solange die Container-Haertung noch laeuft.
      - name: Trivy misconfig scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          severity: HIGH,CRITICAL
          exit-code: 0
