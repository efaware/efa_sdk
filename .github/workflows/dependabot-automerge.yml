name: Dependabot auto-merge

# Aktiviert GitHub-Auto-merge für Dependabot-PRs (NUR patch/minor) auf `main`, sobald die
# required Checks (build-check.yml + security.yml) grün sind. Majors werden NIE
# auto-gemerged. Unbedenklich, weil bei uns merge != release: ein Merge nach `main` baut
# nichts und publiziert nichts — den npm-Publish löst ausschließlich ein v*-Tag aus
# (publish.yml). Der Maintainer taggt weiterhin von Hand.
#
# AKTIV seit 31.08.2026 (Notion #139): `allow_auto_merge` an, Ruleset „main-protection"
# mit den 11 CI-Checks (sdk / npm audit / License gate / Trivy) als required, Secret-
# Scanning + Push-Protection + CodeQL-Default-Setup an, `ENABLE_AUTOMERGE`-Variable
# gesetzt. Merge-Methode: SQUASH — Squash-Merges müssen im Repo erlaubt sein (Default an).
on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: ${{ github.actor == 'dependabot[bot]' && vars.ENABLE_AUTOMERGE == 'true' }}
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Dependabot-Metadaten lesen
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # github-script statt `gh` CLI: läuft auch auf dem self-hosted Runner (kein
      # vorinstalliertes gh nötig). Tolerant — schlägt nicht rot fehl, falls Auto-merge
      # im Repo (noch) nicht erlaubt ist (dann nur eine Warnung).
      - name: Auto-merge (patch/minor) aktivieren
        if: ${{ steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor' }}
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.graphql(
                `mutation($id: ID!) {
                  enablePullRequestAutoMerge(input: { pullRequestId: $id, mergeMethod: SQUASH }) {
                    pullRequest { number }
                  }
                }`,
                { id: context.payload.pull_request.node_id }
              );
              core.info('Auto-merge aktiviert.');
            } catch (e) {
              core.warning('Auto-merge nicht aktiviert (Repo-Setting allow_auto_merge aus?): ' + e.message);
            }
