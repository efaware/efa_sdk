name: Build Images

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  # IMAGE_BASE wird im Compute-Step gesetzt — der GitHub-Repo-Name darf
  # Hyphens enthalten, der GHCR-Image-Name muss Underscores tragen, damit der
  # davon abgeleitete serviceKey die Deployer-Regex `/^[a-z][a-z0-9_]{1,63}$/`
  # erfüllt.

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute IMAGE_BASE (normalize repo name)
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          REPO_NORM="${REPO//-/_}"
          echo "IMAGE_BASE=${OWNER}/${REPO_NORM}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (backend)
        id: meta_backend
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-backend
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest
            type=ref,event=tag

      - name: Docker meta (frontend)
        id: meta_frontend
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-frontend
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest
            type=ref,event=tag

      - name: Build & push backend
        id: build_backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}

      - name: Build & push frontend
        id: build_frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./frontend/Dockerfile
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign backend image
        run: cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-backend@${{ steps.build_backend.outputs.digest }}"

      - name: Sign frontend image
        run: cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-frontend@${{ steps.build_frontend.outputs.digest }}"
